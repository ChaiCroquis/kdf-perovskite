version: 2
updates:
  # Rust crate dependencies (workspace).
  # Weekly batched PRs to surface advisory drift (RUSTSEC-2025-0020 style)
  # before they accumulate. Limit pace so PRs stay reviewable.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cargo)"
    labels:
      - "dependencies"
      - "rust"
    ignore:
      # Major version bumps with breaking API surface; declined 2026-05-10
      # after empirical CI failure (cargo test/clippy across all OS targets).
      # Re-evaluate when a dedicated migration sprint is scheduled.
      - dependency-name: "criterion"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rand_chacha"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ureq"
        update-types: ["version-update:semver-major"]

  # GitHub Actions versions (e.g. dtolnay/rust-toolchain, EmbarkStudios/cargo-deny-action).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(actions)"
    labels:
      - "dependencies"
      - "ci"
