[package]
name = "kdf-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for KDF (Knowledge Decay Framework)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
kdf = { path = "../kdf-lib", default-features = false }
serde = { workspace = true }
serde-wasm-bindgen = "0.6"

[lints]
workspace = true
