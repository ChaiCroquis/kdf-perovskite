[package]
name = "kdf-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line interface for KDF (Knowledge Decay Framework)"
license = "MIT"

[[bin]]
name = "kdf"
path = "src/main.rs"

[dependencies]
kdf = { path = "../kdf-lib" }
clap = { version = "4.4", features = ["derive"] }
csv = "1.3"
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
