[package]
name = "demo-d7-github-issue"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
description = "KDF Showcase D7 — GitHub issue archive with analogy-based reopen candidate detection"
default-run = "demo-d7-github-issue"

[[bin]]
name = "demo-d7-github-issue"
path = "src/main.rs"

[dependencies]
kdf-demos-common = { path = "../common" }
cgb-kdf = { path = "../../crates/cgb-kdf" }
real-data-bench = { path = "../../benchmarks/real_data" }
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.10"
urlencoding = "2.1"

[lints]
workspace = true
