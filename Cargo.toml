    "crates/bias-detector",
    "crates/cgb-kdf",
    "crates/kdf-perovskite-py",
    "kdf-lib",
    "kdf-cli",
    "kdf-python",
    "kdf-wasm",
    "tests/edge_vs_node_comparison",
    "benchmarks/sota_comparison",
    "benchmarks/real_data",
    "benchmarks/adversarial",
    "demos/common",
    "demos/D1_obsidian",
    "demos/D2_nasa_log",
    "demos/D5_fb15k237",
