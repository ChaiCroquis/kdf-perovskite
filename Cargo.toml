[workspace]
resolver = "2"
members = [
    "crates/cgb-types",
    "crates/cgb-graph",
    "crates/bias-detector",
    "crates/cgb-kdf",
    "kdf-lib",
    "kdf-cli",
    "kdf-python",
    "kdf-wasm",
    "tests/edge_vs_node_comparison",
    "benchmarks/sota_comparison",
    "benchmarks/real_data",
    "benchmarks/adversarial",
    "demos/common",
    "demos/D1_obsidian",
    "demos/D2_nasa_log",
    "demos/D5_fb15k237",
    "demos/D3_ml_longtail",
    "demos/D6_text_dedup",
    "demos/D7_github_issue",
    "demos/D4_movielens",
    "demos/D8_llm_memory",
