[workspace.package]
edition = "2021"
license-file = "LICENSE"

# --- Patent compliance responsibility matrix ---
#
# Authoritative spec: patent JP 2026-027032 (filed/ PDFs added to docs/patent/filed/ after JPO auto-publication ~2027-08)
# Compliance tracking: docs/patent/TRACEABILITY.md, docs/patent/COMPLIANCE.md
#
# +-------------------+---------------------------------+---------------------------+
# | Crate             | Role                            | Compliance Target          |
# +-------------------+---------------------------------+---------------------------+
# | cgb-kdf           | Reference impl (Full Rev.12)    | Claim 1 - 50 (primary)     |
# | kdf-lib           | Rev.10 Basic backend (subset)   | Claim 1-19 subset          |
# | kdf-cli           | CLI frontend                    | n/a (UI wrapper)           |
# | kdf-python        | PyO3 bindings over cgb-kdf      | mirrors cgb-kdf            |
# | kdf-wasm          | WASM bindings over cgb-kdf      | mirrors cgb-kdf            |
# | cgb-types         | Shared types                    | n/a                        |
# | cgb-graph         | Graph primitives                | n/a                        |
# +-------------------+---------------------------------+---------------------------+
#
# See docs/patent/SPEC.md for authority rules.

[workspace.metadata.patent]
authoritative-spec = "docs/patent/filed/"
compliance-report = "docs/patent/COMPLIANCE.md"
traceability = "docs/patent/TRACEABILITY.md"
reference-implementation = "cgb-kdf"

# --- Workspace-wide clippy lint policy ---
#
# Lints intentionally allowed across the workspace:
#   - needless_range_loop: idiomatic for numerical computations
#       (e.g. `for d in 0..dim { point[d] = ... }` is clearer than enumerate())
#   - type_complexity: complex tuple/Vec types are explicit by intent
#       (extracting a type alias often hides intent rather than aiding it)
#   - useless_vec: `vec![...]` form is clearer than array literals for test data
#   - field_reassign_with_default: occasionally cleaner when only 1-2 fields set
#       (most call sites have been migrated to struct-init form)
#
# Each member crate opts in via `[lints] workspace = true` in its Cargo.toml.
[workspace.lints.clippy]
needless_range_loop = "allow"
type_complexity = "allow"
useless_vec = "allow"

# --- Centralized dependency versions (Rust 1.74+ workspace.dependencies) ---
#
# Top-frequency dep集約 (drift 防止、dev と同方針). Each member references via
# `dep = { workspace = true }`, optionally overriding features.
[workspace.dependencies]
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
pyo3 = { version = "0.28", features = ["extension-module"] }
