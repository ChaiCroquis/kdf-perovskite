[package]
name = "kdf-python"
version = "0.1.0"
edition = "2021"
description = "Python bindings for KDF (Knowledge Decay Framework)"
license = "MIT"

[lib]
name = "kdf_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true }
kdf = { path = "../kdf-lib", default-features = false }

[lints]
workspace = true
