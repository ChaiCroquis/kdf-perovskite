[package]
name = "cgb-kdf"
version = "0.1.0"
edition = "2024"
description = "Knowledge Decay Framework - Core components for rare truth protection"
license-file = "../../LICENSE"

[dependencies]
# Linear Algebra (固有値計算)
nalgebra = "0.35"
# Sparse linear algebra for VNE on n >= 1000 (Hutchinson + Chebyshev,
# avoids dense O(n³) eigendecomposition). Apache-2.0, matches nalgebra.
nalgebra-sparse = "0.11"
# Parallelism (Step 2/3 hotspot parallelization for apply_edge_decay and batch_compute)
rayon = { workspace = true }
# RNG (deterministic, defensible).
# rand_chacha unifies the two xorshift64 implementations that previously
# lived in fingerprint/rng.rs and causal/estimators/ksg.rs. ChaCha8 gives
# bias-free f64 sampling and survives seed=0 (xorshift64 emits an all-zero
# stream from seed=0), which matters for Claim 12 (Bernoulli pruning) and
# the KSG surrogate test.
rand = { workspace = true }
rand_chacha = "0.3"

[dev-dependencies]
proptest = "1.5"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "decay_bench"
harness = false

[lints]
workspace = true
